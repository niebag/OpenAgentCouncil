name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  owner-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository owner
        if: github.actor != 'niebag'
        run: |
          echo "Only niebag can publish this package."
          exit 1

  publish:
    needs: owner-gate
    if: github.actor == 'niebag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run build
      - name: Pack artifact
        id: pack
        run: |
          npm pack --json --ignore-scripts > pack.json
          node -e "const fs = require('node:fs'); const [pack] = JSON.parse(fs.readFileSync('pack.json', 'utf8')); console.log('tarball=' + pack.filename)" >> "$GITHUB_OUTPUT"
      - run: OPENAGENTCOUNCIL_TARBALL="${{ steps.pack.outputs.tarball }}" npm run release:validate
      - run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance
